image: maven:3.9-eclipse-temurin-21

stages: [test]

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: maven-java21
  paths: [.m2/repository/]

verification:
  stage: test
  timeout: 20 minutes
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq python3
    - chmod +x mvnw ci/test.sh
  script:
    - bash ci/test.sh
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml
    paths:
      - target/site/jacoco/
      - target/pit-reports/
      - target/evidence/
